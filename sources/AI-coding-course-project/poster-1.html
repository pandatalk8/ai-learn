<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海报 1 — 主视觉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
      font-family: 'Noto Sans SC', 'Outfit', sans-serif;
    }

    .poster {
      width: 540px;
      height: 720px;
      background: #09090b;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* === Background Effects === */
    .poster::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 93, 58, 0.18) 0%, rgba(255, 140, 66, 0.06) 40%, transparent 70%);
      pointer-events: none;
    }

    .poster::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -60px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 65%);
      pointer-events: none;
    }

    /* === Grid lines === */
    .grid-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      opacity: 0.04;
    }

    .grid-v {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: white;
    }

    .grid-h {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: white;
    }

    /* === Content === */
    .content {
      position: relative;
      z-index: 2;
      padding: 48px 44px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 60px;
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: #fafaf9;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: -0.01em;
    }

    .logo-dot {
      width: 7px;
      height: 7px;
      background: #ff5d3a;
      border-radius: 50%;
    }

    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      color: #22c55e;
      padding: 5px 12px;
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 100px;
      background: rgba(34, 197, 94, 0.08);
      letter-spacing: 0.05em;
    }

    /* Main headline */
    .headline {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .headline h1 {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 52px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: #fafaf9;
      margin-bottom: 10px;
    }

    .headline h1 .accent {
      background: linear-gradient(135deg, #ff5d3a, #ff8c42);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .headline .sub {
      font-size: 17px;
      color: #a1a1aa;
      line-height: 1.7;
      max-width: 380px;
      margin-top: 12px;
    }

    /* Terminal snippet */
    .terminal {
      margin-top: 36px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 18px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 2;
    }

    .terminal .prompt {
      color: #22c55e;
    }

    .terminal .cmd {
      color: #fafaf9;
    }

    .terminal .comment {
      color: #52525b;
    }

    .terminal .output {
      color: #ff8c42;
    }

    /* Bottom stats */
    .bottom-stats {
      display: flex;
      gap: 0;
      border-top: 1px solid #27272a;
      margin-top: auto;
    }

    .stat {
      flex: 1;
      padding-top: 22px;
      border-right: 1px solid #27272a;
    }

    .stat:last-child {
      border-right: none;
    }

    .stat .number {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #fafaf9;
      letter-spacing: -0.02em;
    }

    .stat .label {
      font-size: 12px;
      color: #71717a;
      margin-top: 2px;
    }

    /* Decorative corner marks */
    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #27272a;
      border-style: solid;
      z-index: 3;
    }

    .corner-tl { top: 24px; left: 24px; border-width: 1px 0 0 1px; }
    .corner-tr { top: 24px; right: 24px; border-width: 1px 1px 0 0; }
    .corner-bl { bottom: 24px; left: 24px; border-width: 0 0 1px 1px; }
    .corner-br { bottom: 24px; right: 24px; border-width: 0 1px 1px 0; }
    /* Export button */
    .export-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 22px;
      background: #fff;
      color: #0c0c0c;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .export-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(0,0,0,0.4); }
    .export-btn:active { transform: scale(0.97); }
    .export-btn.loading { opacity: 0.6; pointer-events: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <button class="export-btn" onclick="exportPoster(this)">⬇ 导出图片</button>
  <div class="poster" id="poster">
    <!-- Grid lines -->
    <div class="grid-overlay">
      <div class="grid-v" style="left: 25%"></div>
      <div class="grid-v" style="left: 50%"></div>
      <div class="grid-v" style="left: 75%"></div>
      <div class="grid-h" style="top: 25%"></div>
      <div class="grid-h" style="top: 50%"></div>
      <div class="grid-h" style="top: 75%"></div>
    </div>

    <!-- Corner marks -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="content">
      <div class="top-bar">
        <div class="logo"><span class="logo-dot"></span> AI 编程实战课</div>
        <div class="badge">● 正在招生</div>
      </div>

      <div class="headline">
        <h1>
          用 AI 写代码<br>
          <span class="accent">构建你的产品</span>
        </h1>
        <p class="sub">教练带练，动手为主。一个月内从零构建一个真实上线、可获客的项目。</p>

        <div class="terminal">
          <div><span class="prompt">$</span> <span class="cmd">claude "创建我的 SaaS 产品"</span></div>
          <div><span class="comment">// AI 正在为你编写代码...</span></div>
          <div><span class="output">✓ 项目已部署至 production</span></div>
        </div>
      </div>

      <div class="bottom-stats">
        <div class="stat">
          <div class="number">30天</div>
          <div class="label">训练周期</div>
        </div>
        <div class="stat">
          <div class="number">100%</div>
          <div class="label">实操驱动</div>
        </div>
        <div class="stat">
          <div class="number">1个</div>
          <div class="label">上线项目</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    async function exportPoster(btn) {
      btn.classList.add('loading');
      btn.textContent = '导出中...';
      try {
        const poster = document.getElementById('poster');
        const canvas = await html2canvas(poster, {
          scale: 2,
          useCORS: true,
          backgroundColor: null,
        });
        const link = document.createElement('a');
        link.download = 'AI编程实战课-主海报.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (e) {
        alert('导出失败: ' + e.message);
      }
      btn.classList.remove('loading');
      btn.innerHTML = '⬇ 导出图片';
    }
  </script>
</body>
</html>
